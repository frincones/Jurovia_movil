name: Publicar Android (Google Play)

# Compila el App Bundle firmado y lo sube a Google Play.
# Solo a mano o con un tag v*.*.*, para que ningun merge accidental publique.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Canal de Google Play
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      subir:
        description: Subir a Google Play (si no, solo compila y deja el artefacto)
        type: boolean
        default: true
  push:
    tags: ['v*.*.*']

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  android:
    name: Build + upload Android
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verificar secrets obligatorios
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          faltan=""
          [ -z "$KEYSTORE" ] && faltan="$faltan ANDROID_KEYSTORE_BASE64"
          [ -z "$ANON" ] && faltan="$faltan SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets:$faltan — ver docs/DESPLIEGUE_TIENDAS.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restaurar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - run: flutter pub get

      # El build number debe subir en cada envio o Google Play lo rechaza.
      # github.run_number es monotono creciente por workflow.
      - name: Compilar App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=APP_FLAVOR=production \
            --dart-define=BACKEND_URL=${{ vars.BACKEND_URL || 'https://legal-ai-backend-production-bdd2.up.railway.app' }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://tfhhcokgrpagwwlctjtz.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jurovia-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Sin estos simbolos, las trazas de un build ofuscado son ilegibles.
      - name: Guardar simbolos de depuracion
        uses: actions/upload-artifact@v4
        with:
          name: jurovia-symbols-android
          path: build/symbols
          retention-days: 90

      - name: Subir a Google Play
        if: ${{ github.event.inputs.subir != 'false' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jurovia.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft

      - name: Limpiar credenciales del runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
