name: Publicar iOS (TestFlight / App Store)

# iOS SOLO se puede compilar en macOS: Xcode no existe para Linux ni Windows.
# Por eso este job corre en un runner macOS, que consume minutos de GitHub
# Actions a una tarifa mayor (x10 frente a Linux). De ahi que se dispare solo
# a mano o con un tag.
on:
  workflow_dispatch:
    inputs:
      subir:
        description: Subir a TestFlight (si no, solo compila y deja el .ipa)
        type: boolean
        default: true
  push:
    tags: ['v*.*.*']

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  ios:
    name: Build + upload iOS
    runs-on: macos-latest
    environment: production
    steps:
      - name: Verificar secrets obligatorios
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APPLE_ASC_KEY_BASE64 }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          faltan=""
          [ -z "$CERT" ] && faltan="$faltan IOS_CERTIFICATE_BASE64"
          [ -z "$PROFILE" ] && faltan="$faltan IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$ASC_KEY" ] && faltan="$faltan APPLE_ASC_KEY_BASE64"
          [ -z "$ANON" ] && faltan="$faltan SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets:$faltan — ver docs/DESPLIEGUE_TIENDAS.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Importar certificado de firma
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Instalar perfil de aprovisionamiento
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/jurovia.mobileprovision

      - name: Generar ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist

      - run: flutter pub get

      # CFBundleVersion debe subir en cada envio o App Store Connect lo rechaza.
      - name: Compilar IPA
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=APP_FLAVOR=production \
            --dart-define=BACKEND_URL=${{ vars.BACKEND_URL || 'https://legal-ai-backend-production-bdd2.up.railway.app' }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://tfhhcokgrpagwwlctjtz.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jurovia-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Subir a TestFlight
        if: ${{ github.event.inputs.subir != 'false' }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/jurovia.ipa
          issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_ASC_KEY_BASE64 }}

      - name: Limpiar credenciales del runner
        if: always()
        run: |
          rm -f ios/ExportOptions.plist
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/jurovia.mobileprovision
